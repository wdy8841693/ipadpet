# XcodeGen 工程描述文件
# 在 macOS 上执行:  brew install xcodegen && xcodegen generate
# 生成 WhalePet.xcodeproj 后用 Xcode 打开即可。
name: WhalePet
options:
  bundleIdPrefix: com.whalepet
  deploymentTarget:
    iOS: "15.0"          # iPad mini 4 最高支持 iPadOS 15.8.x
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2"        # 仅 iPad
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "RAH58F9C4L"       # 吴老师的 Personal Team（免费 Apple ID）
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  WhalePet:
    type: application
    platform: iOS
    sources:
      - path: WhalePet
    info:
      path: WhalePet/Support/Info.plist
      properties:
        CFBundleDisplayName: 鲸鱼娘DSH
        CFBundleShortVersionString: "1.2.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}             # iPadOS 15 用空 LaunchScreen 即全屏自适应
        UIRequiresFullScreen: true     # 全屏运行，禁用分屏（老设备省内存）
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        ITSAppUsesNonExemptEncryption: false
        # ---- 语音与内网服务器所需权限 ----
        NSMicrophoneUsageDescription: 用于语音唤醒（"小鲸小鲸"）与语音指令识别，音频仅在局域网内发送到你的桥接服务器。
        NSSpeechRecognitionUsageDescription: 语音指令的识别在你的服务器上完成，此权限用于麦克风音频采集。
        NSLocalNetworkUsageDescription: 需要访问局域网内你自己部署的 WhalePet 桥接服务器。
        NSAppTransportSecurity:
          # 允许访问内网 HTTP 服务器（语音桥接）。只放行本地网络，不放行任意明文。
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: WhalePet
        PRODUCT_BUNDLE_IDENTIFIER: com.dywu.whalepet
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - WhalePetTests
  WhalePetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhalePetTests
    dependencies:
      - target: WhalePet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES