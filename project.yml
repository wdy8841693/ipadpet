# XcodeGen 工程描述文件
# 在 macOS 上执行:  brew install xcodegen && xcodegen generate
# 生成 WhalePet.xcodeproj 后用 Xcode 打开即可。
name: WhalePet
options:
  bundleIdPrefix: com.whalepet
  deploymentTarget:
    iOS: "15.0"          # iPad mini 4 最高支持 iPadOS 15.8.x
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2"        # 仅 iPad
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""               # ← 填入你的 Apple Developer Team ID（免费账号也可）
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  WhalePet:
    type: application
    platform: iOS
    sources:
      - path: WhalePet
    info:
      path: WhalePet/Support/Info.plist
      properties:
        CFBundleDisplayName: 鲸鱼娘DSH
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}             # iPadOS 15 用空 LaunchScreen 即全屏自适应
        UIRequiresFullScreen: true     # 全屏运行，禁用分屏（老设备省内存）
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whalepet.dsh
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - WhalePetTests
  WhalePetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhalePetTests
    dependencies:
      - target: WhalePet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES