- insert:
    - id: whalepet-bridge
      name: '@dywu/whalepet-dsh-bridge'
      config:
        host: 0.0.0.0
        port: 8787
        language: zh
        # 宠物会话 = 完整 DSH Agent：能读写工作区、跑命令、检索网页。
        # 想更放开可改 danger-full-access；不想动权限就显式写 ''。
        permissionPreset: workspace-write
        requestTimeoutMs: 300000
        # 其它 DSH 会话（GUI/其它 agent 开的任务）开始、结束、需要授权时，也让宠物播报一句。
        announceOtherSessions: true
        # 只喊唤醒词不说指令时，宠物回一句（空字符串 = 不启用）。
        wakeAck: 我在
        maxWaitMs: 600000
        # 会话策略：只用一个长期会话，空闲时归档（列表里看不到），起来自动恢复。
        mainSessionId: whalepet-session-main
        archiveWhenIdle: true
        # 0 = 永久同一个会话（像 Super Agent 一样只聊一个）；>0 = 每 N 小时换新（旧的归档）。
        # 单会话要靠上下文自动压缩兜底：profile 里需启用 compaction-basic。
        rotateAfterHours: 0
        sessionTitle: '🐋 鲸鱼娘（自动维护，不用管）'